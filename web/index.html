<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RF Bench Toolkit</title>
<!-- The palette, the type scale and the faces, generated by the server
     from apps/theme.py - the same tokens the desktop launcher window is
     painted with, so the two front ends cannot drift. Served from here
     rather than a font CDN, so the page renders the same with no
     network; the SIL OFL ships beside the files in fonts/. -->
<link rel="stylesheet" href="/theme.css">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--f-ui);font-size:var(--s-md);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 56px}

.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--ground);border-bottom:1px solid var(--rule)}
.rail-in{max-width:1080px;margin:0 auto;padding-inline:16px;display:flex;
  align-items:center;gap:14px;min-height:54px;flex-wrap:wrap}
.mark{font-family:var(--f-num);font-weight:600;font-size:var(--s-lg)}
.rail-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.radio-tag{font-size:var(--s-xs);color:var(--ink-2);padding:4px 9px;
  border:1px solid var(--rule);border-radius:2px}
/* The theme picker, from voice-summary: one disc that IS the theme in force,
   its ground ringed in its rule with its trace at the centre, and a click
   moves on to the next. Drawn from the tokens rather than from colours of
   its own, so it cannot stop resembling its theme. */
.theme-picker{display:flex;align-items:center;gap:4px}
.theme-label{font-size:var(--s-sm);color:var(--ink-2);user-select:none}
.theme-chip{display:grid;place-items:center;width:32px;height:32px;border-radius:50%}
.theme-chip::before,.theme-chip::after{content:"";grid-area:1/1;border-radius:50%;
  transition:transform .15s}
.theme-chip::before{width:22px;height:22px;background:var(--ground);border:1px solid var(--rule)}
.theme-chip::after{width:8px;height:8px;background:var(--trace)}
.theme-chip:hover::before,.theme-chip:hover::after{transform:scale(1.12)}
.theme-chip:focus-visible{outline-offset:-3px}
.gear{display:grid;place-items:center;width:32px;height:32px;border-radius:2px;color:var(--ink-2)}
.gear:hover,.gear[aria-expanded="true"]{color:var(--ink);background:var(--panel)}

.banner{margin-top:16px;padding:11px 13px;border-left:2px solid var(--warn);
  background:var(--panel);color:var(--ink-2);font-size:var(--s-sm);border-radius:0 2px 2px 0}
.banner b{color:var(--ink);font-weight:500}
.banner[hidden]{display:none}

/* ---------------------------------------------------------------- running */
.onair{margin-top:18px;border:1px solid var(--live);border-radius:2px;background:var(--panel)}
.onair[hidden]{display:none}
.onair-head{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid var(--rule-soft);
  font-family:var(--f-num);font-weight:600;letter-spacing:.12em;font-size:var(--s-xs);color:var(--live)}
.onair-head .bulb{width:9px;height:9px;border-radius:50%;background:var(--live);
  box-shadow:0 0 10px var(--live);flex:none}
.onair-row{display:flex;align-items:center;gap:12px;padding:10px 13px;flex-wrap:wrap}
.onair-row + .onair-row{border-top:1px solid var(--rule-soft)}
.onair-row .who{flex:1;min-width:0}
.onair-row .meta{font-size:var(--s-xs);color:var(--ink-3);font-variant-numeric:tabular-nums}
.stop{padding:5px 12px;border:1px solid var(--rule);border-radius:2px;font-size:var(--s-sm);color:var(--ink-2)}
.stop:hover{border-color:var(--live);color:var(--live)}

/* ------------------------------------------------------------------ grid */
.bank{padding-block:26px 0}
.bank-name{font-size:var(--s-sm);color:var(--ink-2);margin:0 0 10px;
  display:flex;align-items:baseline;gap:12px}
.bank-name::after{content:"";flex:1;height:1px;background:var(--rule-soft)}
.bank-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

.tile{position:relative;background:var(--panel);border:1px solid var(--rule);border-radius:2px;
  padding:0 0 11px;text-align:left;display:flex;flex-direction:column;overflow:hidden;
  transition:border-color .12s,background .12s}
.tile:hover{border-color:var(--ink-3);background:var(--panel-2)}
.tile .face{display:flex;flex-direction:column;flex:1;
  transition:transform .19s ease-in,opacity .19s ease-in}
.tile.turning .face{transform:scaleX(.02);opacity:.15}
.tile img{width:100%;aspect-ratio:4/3;object-fit:cover;max-width:100%;display:block;
  filter:saturate(.82);transition:filter .16s}
.tile:hover img{filter:saturate(1)}
.tile .dir{font-family:var(--f-num);font-size:var(--s-xs);letter-spacing:.1em;font-weight:600;
  color:var(--ink-3);padding:9px 11px 0}
.tile .name{font-size:var(--s-sm);line-height:1.25;padding:1px 11px 0}
.tile[data-blocked="1"]{opacity:.34}
.tile[data-blocked="1"]:hover{border-color:var(--rule);background:var(--panel)}
.flip{position:absolute;top:6px;right:6px;width:27px;height:27px;border-radius:2px;
  display:grid;place-items:center;color:var(--ink);background:var(--panel);
  border:1px solid var(--ink-3)}
.flip:hover{background:var(--well);border-color:var(--ink-3)}

/* -------------------------------------------------------------- settings */
.sheet{margin-top:22px;border:1px solid var(--rule);border-radius:2px;background:var(--panel);padding:18px}
.sheet[hidden]{display:none}
.sheet h2{margin:0 0 14px;font-family:var(--f-num);font-weight:600;font-size:var(--s-xl)}
.field{padding-block:12px;border-top:1px solid var(--rule-soft)}
.field:first-of-type{border-top:none;padding-top:0}
.field > label{display:block;font-size:var(--s-sm);color:var(--ink-2);margin-bottom:6px}
.field .why{font-size:var(--s-xs);color:var(--ink-3);margin:5px 0 0}
input[type=text],select{width:100%;padding:7px 9px;background:var(--well);color:var(--ink);
  border:1px solid var(--rule);border-radius:2px}
input[type=text]:focus,select:focus{border-color:var(--ink-3)}
.seg{display:flex;gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:2px}
.seg button{flex:1;padding:7px 8px;font-size:var(--s-sm);background:var(--panel-2);color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--well);color:var(--ink)}
.seg button:hover{color:var(--ink)}
.iplist{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.iprow{display:flex;align-items:center;gap:10px;padding:6px 9px;background:var(--well);
  border:1px solid var(--rule-soft);border-radius:2px;font-variant-numeric:tabular-nums}
.iprow span{flex:1;min-width:0;overflow-wrap:anywhere}
.iprow button{color:var(--ink-3);font-size:var(--s-sm)}
.iprow button:hover{color:var(--live)}
.ipadd{display:flex;gap:8px}
.ipadd input{flex:1;min-width:0}
.btn{padding:8px 16px;border:1px solid var(--rule);border-radius:2px;
  background:var(--panel-2);color:var(--ink);font-size:var(--s-sm)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn.primary:hover{background:var(--ink-0)}
.sheet-foot{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.saved{font-size:var(--s-sm);color:var(--ink-3)}

/* ----------------------------------------------------------------- alert */
.alert{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  max-width:520px;margin-inline:auto;background:var(--panel);border:1px solid var(--rule);
  border-left:2px solid var(--warn);border-radius:2px;padding:14px 16px;z-index:40;
  box-shadow:0 12px 32px rgba(0,0,0,.5)}
.alert[hidden]{display:none}
.alert h3{margin:0 0 5px;font-size:var(--s-md);font-weight:600}
.alert p{margin:0;color:var(--ink-2);font-size:var(--s-sm);white-space:pre-line}
.alert .btn{margin-top:12px}
.empty{color:var(--ink-3);font-size:var(--s-sm);padding-block:24px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>

<header class="rail">
  <div class="rail-in">
    <span class="mark">RF Bench Toolkit</span>
    <div class="rail-r">
      <span class="radio-tag" id="radio-tag">—</span>
      <div class="theme-picker">
        <span class="theme-label">Themes</span>
        <button class="theme-chip" id="theme-chip" type="button" title="Theme"></button>
      </div>
      <button class="gear" id="gear" type="button" aria-expanded="false" aria-controls="sheet" title="Settings">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none" aria-hidden="true">
          <path d="M2 4h5M10 4h5M2 8.5h9M14 8.5h1M2 13h3M8 13h7"
            stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="8.5" cy="4" r="1.7" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="12.5" cy="8.5" r="1.7" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="6.5" cy="13" r="1.7" stroke="currentColor" stroke-width="1.4"/>
        </svg>
        <span class="sr-only" hidden>Settings</span>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <p class="banner" id="banner" hidden></p>

  <section class="onair" id="onair" hidden>
    <div class="onair-head"><span class="bulb"></span><span id="onair-title">ON AIR</span></div>
    <div id="onair-rows"></div>
  </section>

  <section class="sheet" id="sheet" hidden>
    <h2>Settings</h2>

    <div class="field">
      <label for="radio-type">Radio</label>
      <select id="radio-type">
        <option value="hackrf">HackRF One (USB)</option>
        <option value="usrp">Ettus USRP (Network)</option>
        <option value="vsg">Signal Hound VSG60 (USB, transmit only)</option>
        <option value="bb60">Signal Hound BB60D (USB, receive only)</option>
      </select>
      <p class="why" id="radio-why"></p>
    </div>

    <div class="field">
      <label>Radio mode</label>
      <div class="seg" id="mode" role="group" aria-label="Radio mode">
        <button type="button" data-v="single" aria-pressed="true">Single</button>
        <button type="button" data-v="multi" aria-pressed="false">Multi</button>
      </div>
      <p class="why">Single runs one app at a time. Multi needs at least two USRP addresses.</p>
    </div>

    <div class="field">
      <label for="media">Media folder</label>
      <input type="text" id="media" placeholder="/data/media" spellcheck="false">
      <p class="why">Where recorded audio and video are read from and written to.</p>
    </div>

    <div class="field">
      <label>USRP addresses</label>
      <div class="iplist" id="iplist"></div>
      <div class="ipadd">
        <input type="text" id="ipnew" placeholder="192.168.10.2" spellcheck="false"
               inputmode="numeric" aria-label="New USRP address">
        <button class="btn" type="button" id="ipadd">Add</button>
      </div>
    </div>

    <div class="sheet-foot">
      <button class="btn primary" type="button" id="save">Save settings</button>
      <button class="btn" type="button" id="close-sheet">Close</button>
      <span class="saved" id="saved"></span>
    </div>
  </section>

  <div id="banks"></div>
</main>

<div class="alert" id="alert" hidden role="alertdialog" aria-labelledby="alert-title">
  <h3 id="alert-title"></h3>
  <p id="alert-body"></p>
  <button class="btn" type="button" id="alert-ok">OK</button>
</div>

<script>
"use strict";

const TOKEN = new URLSearchParams(location.search).get("t") || "";
const HEAD = TOKEN ? { "X-Launch-Token": TOKEN } : {};
let STATE = null, FACES = {};

try { FACES = JSON.parse(localStorage.getItem("tileFaces") || "{}"); } catch (e) { FACES = {}; }
function rememberFace(key, i){
  FACES[key] = i;
  try { localStorage.setItem("tileFaces", JSON.stringify(FACES)); } catch (e) {}
}

async function api(path, body){
  const opt = body
    ? { method:"POST", headers:{ "Content-Type":"application/json", ...HEAD }, body:JSON.stringify(body) }
    : { headers: HEAD };
  const res = await fetch(path, opt);
  let data = {};
  try { data = await res.json(); } catch (e) {}
  return { ok: res.ok, data };
}

function alertBox(title, body){
  document.getElementById("alert-title").textContent = title || "Something went wrong";
  document.getElementById("alert-body").textContent = body || "";
  const box = document.getElementById("alert");
  box.hidden = false;
  document.getElementById("alert-ok").focus();
}
document.getElementById("alert-ok").addEventListener("click", () => {
  document.getElementById("alert").hidden = true;
});

/* --------------------------------------------------------------- the grid */
function blocked(face){
  const allowed = (STATE.directions || {})[STATE.settings.radio_type] || ["tx","rx"];
  return !allowed.includes(face.dir);
}

function paintTile(tile){
  const faces = tile._faces, i = +tile.dataset.face, face = faces[i];
  tile.dataset.blocked = blocked(face) ? "1" : "0";
  const badge = faces.length > 1
    ? '<span class="flip" role="button" tabindex="0" aria-label="Turn this tile over">'
      + '<svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">'
      + '<path d="M2 5.2A4.4 4.4 0 0 1 10.6 6M11 7.8A4.4 4.4 0 0 1 2.4 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>'
      + '<path d="M1.2 2.6v2.6h2.6M11.8 10.4V7.8H9.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>'
      + '</svg></span>'
    : "";
  tile.innerHTML = badge
    + '<span class="face">'
    + '<img src="/icons/' + face.icon + '" alt="" loading="lazy">'
    + '<span class="dir">' + (face.dir === "tx" ? "TRANSMIT" : "RECEIVE") + '</span>'
    + '<span class="name">' + face.label + '</span></span>';
  tile.title = blocked(face)
    ? face.label + " — the selected radio cannot " + (face.dir === "tx" ? "transmit" : "receive")
    : "Start " + face.label;

  const flip = tile.querySelector(".flip");
  if (flip){
    const turn = e => { e.stopPropagation(); e.preventDefault(); flipTile(tile); };
    flip.addEventListener("click", turn);
    flip.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") turn(e); });
  }
}

function flipTile(tile, to){
  const faces = tile._faces;
  const next = to !== undefined ? to : (+tile.dataset.face + 1) % faces.length;
  if (next === +tile.dataset.face) return;
  const settle = () => { tile.dataset.face = next; rememberFace(faces[0].module, next); paintTile(tile); };
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches){ settle(); return; }
  tile.classList.add("turning");
  setTimeout(() => { settle(); tile.classList.remove("turning"); }, 190);
}

function buildGrid(){
  const host = document.getElementById("banks");
  host.innerHTML = "";
  (STATE.banks || []).forEach(bank => {
    const sec = document.createElement("section");
    sec.className = "bank";
    sec.innerHTML = '<h2 class="bank-name">' + bank.name + '</h2>';
    const row = document.createElement("div");
    row.className = "bank-row";
    bank.tiles.forEach(faces => {
      const tile = document.createElement("button");
      tile.type = "button";
      tile.className = "tile";
      tile._faces = faces;
      const saved = FACES[faces[0].module];
      tile.dataset.face = String(saved !== undefined && saved < faces.length ? saved : 0);
      paintTile(tile);
      tile.addEventListener("click", e => {
        if (e.target.closest(".flip")) return;
        startApp(faces[+tile.dataset.face]);
      });
      row.appendChild(tile);
    });
    sec.appendChild(row);
    host.appendChild(sec);
  });
}

/* A radio that can only go one way turns every tile to a side it can run. */
function turnTilesToRadio(){
  const allowed = (STATE.directions || {})[STATE.settings.radio_type] || ["tx","rx"];
  if (allowed.length !== 1) return;
  document.querySelectorAll(".tile").forEach(tile => {
    const i = tile._faces.findIndex(f => f.dir === allowed[0]);
    if (i >= 0) flipTile(tile, i);
  });
}

async function startApp(face){
  if (blocked(face)){
    const radio = (STATE.radio_labels || {})[STATE.settings.radio_type] || "The selected radio";
    const word = face.dir === "tx" ? "transmit" : "receive";
    alertBox("This Radio Cannot " + word[0].toUpperCase() + word.slice(1),
      radio + " cannot " + word + ", so it cannot run this application.\n\n"
      + "Choose a different radio in Settings, or a tile that this one can run.");
    return;
  }
  const { data } = await api("/api/launch", { module: face.module });
  if (!data.ok){ alertBox(data.title, data.detail); return; }
  refresh();
}

/* ------------------------------------------------------------- what is on */
function paintRunning(){
  const list = STATE.running || [];
  const box = document.getElementById("onair");
  box.hidden = list.length === 0;
  document.getElementById("onair-title").textContent =
    list.length > 1 ? "ON AIR — " + list.length + " RUNNING" : "ON AIR";
  const rows = document.getElementById("onair-rows");
  rows.innerHTML = "";
  list.forEach(entry => {
    const el = document.createElement("div");
    el.className = "onair-row";
    const mins = Math.floor(entry.seconds / 60), secs = entry.seconds % 60;
    el.innerHTML = '<span class="who">' + entry.label
      + '<br><span class="meta">pid ' + entry.pid + ' · running '
      + (mins ? mins + "m " : "") + secs + 's</span></span>';
    const stop = document.createElement("button");
    stop.className = "stop"; stop.type = "button"; stop.textContent = "Stop";
    stop.addEventListener("click", async () => {
      stop.disabled = true;
      await api("/api/stop", { pid: entry.pid });
      setTimeout(refresh, 400);
    });
    el.appendChild(stop);
    rows.appendChild(el);
  });
}

/* ---------------------------------------------------------------- settings */
function paintSettings(){
  const s = STATE.settings;
  document.getElementById("radio-type").value = s.radio_type;
  document.getElementById("media").value = s.media_directory || "";
  document.querySelectorAll("#mode button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.v === s.radio_mode)));
  document.getElementById("radio-tag").textContent =
    (STATE.radio_labels || {})[s.radio_type] || s.radio_type;

  const allowed = (STATE.directions || {})[s.radio_type] || ["tx","rx"];
  document.getElementById("radio-why").textContent = allowed.length === 1
    ? (STATE.radio_labels[s.radio_type] || "This radio") + " only "
      + (allowed[0] === "tx" ? "transmits" : "receives") + ", so the grid turns to match."
    : "Transmits and receives, so every tile is available.";

  const list = document.getElementById("iplist");
  list.innerHTML = "";
  (s.ip_addresses || []).forEach((ip, i) => {
    const row = document.createElement("div");
    row.className = "iprow";
    row.innerHTML = '<span>' + ip + '</span>';
    const rm = document.createElement("button");
    rm.type = "button"; rm.textContent = "Remove";
    rm.setAttribute("aria-label", "Remove " + ip);
    rm.addEventListener("click", () => {
      STATE.settings.ip_addresses.splice(i, 1);
      paintSettings();
    });
    row.appendChild(rm);
    list.appendChild(row);
  });
  if (!(s.ip_addresses || []).length)
    list.innerHTML = '<p class="empty" style="padding:0">None set. The USRP needs one; the other radios do not.</p>';
}

document.getElementById("mode").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  STATE.settings.radio_mode = b.dataset.v;
  paintSettings();
});
document.getElementById("radio-type").addEventListener("change", e => {
  STATE.settings.radio_type = e.target.value;
  paintSettings();
});
document.getElementById("ipadd").addEventListener("click", addIp);
document.getElementById("ipnew").addEventListener("keydown", e => {
  if (e.key === "Enter"){ e.preventDefault(); addIp(); }
});
function addIp(){
  const field = document.getElementById("ipnew");
  const ip = field.value.trim();
  if (!ip) return;
  STATE.settings.ip_addresses = STATE.settings.ip_addresses || [];
  if (!STATE.settings.ip_addresses.includes(ip)) STATE.settings.ip_addresses.push(ip);
  field.value = "";
  paintSettings();
}

document.getElementById("save").addEventListener("click", async () => {
  const s = STATE.settings;
  const { data } = await api("/api/settings", {
    media_directory: document.getElementById("media").value.trim(),
    ip_addresses: s.ip_addresses || [],
    radio_mode: s.radio_mode,
    radio_type: s.radio_type
  });
  if (!data.ok){ alertBox(data.title, data.detail); return; }
  document.getElementById("saved").textContent = "Saved";
  setTimeout(() => { document.getElementById("saved").textContent = ""; }, 2200);
  await refresh();
  turnTilesToRadio();
});

const gear = document.getElementById("gear");
gear.addEventListener("click", () => {
  const sheet = document.getElementById("sheet");
  sheet.hidden = !sheet.hidden;
  gear.setAttribute("aria-expanded", String(!sheet.hidden));
  if (!sheet.hidden) document.getElementById("radio-type").focus();
});
document.getElementById("close-sheet").addEventListener("click", () => {
  document.getElementById("sheet").hidden = true;
  gear.setAttribute("aria-expanded", "false");
  gear.focus();
});

/* ------------------------------------------------------------------- theme */
// Switching sets one attribute on <html> and the browser re-resolves every
// var() under it, so nothing is redrawn. The choice is kept in the settings
// file, beside the radio, because the desktop launcher, its dialogs and the
// app windows this page starts all read it from there - and the refresh
// below follows a change made at the desktop.
const chip = document.getElementById("theme-chip");
// When the page last changed theme. A refresh that was asked for before
// then may carry the theme from before the click, and must not put it back.
let themeSetAt = 0;

function themeKeys(){ return ((STATE && STATE.themes) || []).map(t => t[0]); }
function themeName(key){
  const hit = ((STATE && STATE.themes) || []).find(t => t[0] === key);
  return hit ? hit[1] : key;
}
function liveTheme(){
  // The default is the one that carries no attribute.
  return document.documentElement.getAttribute("data-theme") || themeKeys()[0];
}
function nextTheme(){
  const keys = themeKeys();
  return keys[(Math.max(0, keys.indexOf(liveTheme())) + 1) % keys.length];
}
function setTheme(key){
  const keys = themeKeys();
  if (!keys.length) return;
  if (key === keys[0] || !keys.includes(key)) document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", key);
  // A cycling control has to say where it goes, or its only clue is the
  // colour you are already looking at.
  chip.title = "Theme: " + themeName(liveTheme());
  chip.setAttribute("aria-label", "Theme: " + themeName(liveTheme())
    + ". Activate for " + themeName(nextTheme()) + ".");
}
chip.addEventListener("click", async () => {
  if (!themeKeys().length) return;
  const next = nextTheme();
  themeSetAt = Date.now();
  setTheme(next);
  const { data } = await api("/api/theme", { theme: next });
  themeSetAt = Date.now();
  if (!data.ok) alertBox("Could not keep the theme", data.detail || "");
});

/* -------------------------------------------------------------------- boot */
async function refresh(){
  const asked = Date.now();
  const { ok, data } = await api("/api/state");
  if (!ok){
    alertBox("Cannot reach the launcher",
      data.error === "bad token"
        ? "This page needs the token the server printed when it started. Open the URL it gave you."
        : "The launcher server is not answering. Is it still running?");
    return;
  }
  const first = STATE === null;
  const keepIps = !first && !document.getElementById("sheet").hidden;
  const editing = keepIps ? STATE.settings : null;
  STATE = data;
  if (asked > themeSetAt) setTheme(data.settings.theme);
  if (editing) STATE.settings = editing;   // don't wipe edits under the user

  document.getElementById("banner").hidden = STATE.display;
  if (!STATE.display)
    document.getElementById("banner").innerHTML =
      "<b>No display on " + STATE.host + ".</b> Apps launched from here would have "
      + "nowhere to draw their window. Start the server from the desktop session "
      + "that owns the screen.";

  paintSettings();
  paintRunning();
  if (first || document.querySelectorAll(".tile").length === 0) buildGrid();
  else document.querySelectorAll(".tile").forEach(paintTile);
}

refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 3000);
</script>
</body>
</html>
